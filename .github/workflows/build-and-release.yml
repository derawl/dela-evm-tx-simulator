name: Build and Release Prismik App

on:
  push:
    branches: [main, master]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # Add timeout to prevent hanging

    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Delete package-lock.json
        run: |
          if (Test-Path package-lock.json) { Remove-Item package-lock.json -Force }
        shell: pwsh
        if: matrix.os == 'windows-latest'

      - name: Delete package-lock.json (Unix)
        run: rm -f package-lock.json
        if: matrix.os != 'windows-latest'

      - name: Clean npm cache
        run: npm cache clean --force

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          npm config set fund false
          npm config set audit false
          npm install --verbose --no-optional --no-shrinkwrap
        shell: cmd
        env:
          CI: true
          NODE_ENV: development
          npm_config_yes: true
          npm_config_fund: false
          npm_config_audit: false

      - name: Install dependencies (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          npm config set fund false
          npm config set audit false
          npm install --verbose --omit=optional
        env:
          CI: true
          NODE_ENV: development

      - name: Install TypeScript globally
        run: npm install -g typescript

      - name: Verify TypeScript installation
        run: tsc --version

      - name: Build TypeScript
        run: npm run build

      - name: Build Electron App (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run build:desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
          NODE_ENV: production

      # - name: Build Electron App (macOS)
      #   if: matrix.os == 'macos-latest'
      #   run: npm run build:desktop
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     CI: true
      #     CSC_IDENTITY_AUTO_DISCOVERY: false

      # - name: Build Electron App (Linux)
      #   if: matrix.os == 'ubuntu-latest'
      #   run: npm run build:desktop
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     CI: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-app-${{ matrix.os }}
          path: dist-electron/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            electron-app-windows-latest/**/*.exe
            electron-app-windows-latest/**/*.msi
            electron-app-macos-latest/**/*.dmg
            electron-app-ubuntu-latest/**/*.AppImage
            electron-app-ubuntu-latest/**/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
